*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#050608;overflow:hidden}
body{font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01" on,"cv11" on;color:#f2f4f7}
#frame{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#050608}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}

/* Big type: the site's headline cut (Geist 600, tight tracking). */
.big{position:absolute;font-weight:600;letter-spacing:-.05em;line-height:.94;white-space:nowrap;color:#f2f4f7}
.big .ln{display:block}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:.05em .07em .21em;margin:-.05em -.07em -.21em}
.w{display:inline-block;transform-origin:50% 50%}
.key{color:#7cc6ff}
.pp{display:inline-block;opacity:0}
.bl{display:inline-block;width:0;height:0;vertical-align:baseline}

/* Eyebrow pill (adronis.css .eyebrow, scaled for the frame) */
.eyebrow{position:absolute;display:flex;align-items:center;height:68px;padding:0 32px 0 25px;border-radius:34px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);font-size:31px;font-weight:500;color:#b3b9c4;white-space:nowrap}
.eyebrow .eb-dot{width:15px;height:15px;border-radius:50%;margin-right:17px;flex:none}

/* Step 01 brief form (Adronis.dc.html .mk, x2.7) */
.mk{position:absolute;width:810px;border-radius:49px;border:2.5px solid rgba(255,255,255,.1);background:#12141a;padding:44px;box-shadow:0 64px 130px -56px rgba(0,0,0,.85)}
.mk-row+.mk-row{margin-top:32px}
.mk-l{display:block;font-size:31px;font-weight:500;line-height:1.3;color:#878d98}
.mk-v{position:relative;display:flex;align-items:center;margin-top:16px;height:97px;padding:0 32px;border-radius:27px;border:2.5px solid rgba(255,255,255,.1);background:#090b0e;font-size:36px;color:#f2f4f7;white-space:nowrap}
.mk-v.is-target{border-color:transparent}
.mk-chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.mk-chips span{padding:15px 27px;border-radius:999px;border:2.5px solid rgba(255,255,255,.1);font-size:32px;line-height:1.2;color:#878d98;white-space:nowrap}

/* Hero float chip "Drop ready" (Adronis.dc.html .float-chip, x2.4) */
.fchip{position:absolute;display:flex;align-items:center;gap:26px;padding:24px 40px 24px 24px;border-radius:43px;border:2.4px solid rgba(255,255,255,.1);background:#101217;font-size:33px;font-weight:500;color:#f2f4f7;white-space:nowrap;box-shadow:0 56px 120px -40px rgba(0,0,0,.9)}
.fchip .ic{width:82px;height:82px;flex:none}
.fchip small{display:block;margin-top:6px;font-size:25px;font-weight:500;letter-spacing:.08em;color:#878d98}
.adc{position:absolute;width:240px;height:247px;border-radius:26px;overflow:hidden;border:2px solid rgba(255,255,255,.12);background:#15171b;box-shadow:0 40px 80px -30px rgba(0,0,0,.9)}
.adc img{display:block;width:100%;height:100%;object-fit:cover}

/* Step 03 schedule row (Adronis.dc.html .ms-row, x2.8) */
.msrow{position:absolute;display:flex;align-items:center;gap:31px;width:840px;padding:25px 28px;border-radius:39px;border:2.5px solid rgba(255,255,255,.1);background:#12141a;box-shadow:0 56px 120px -46px rgba(0,0,0,.9)}
.msrow img{display:block;width:106px;height:106px;border-radius:25px;object-fit:cover;flex:none}
.msrow b{display:block;font-size:37px;font-weight:600;line-height:1.25;color:#f2f4f7}
.msrow small{display:block;margin-top:4px;font-size:29px;font-weight:500;letter-spacing:.06em;color:#878d98}
.pillph{flex:none;height:64px;padding:0 26px;font-size:27px;font-weight:500;letter-spacing:.08em;line-height:64px;visibility:hidden;white-space:nowrap}
.msrow .pillph{margin-left:auto}

/* Swipe card (lb-swipe.js .sw-card, x1.25) */
.swc{position:absolute;width:462px;border-radius:32px;overflow:hidden;border:1.5px solid rgba(255,255,255,.1);background:#101217;box-shadow:0 38px 88px -30px rgba(0,0,0,.85),0 15px 30px -15px rgba(0,0,0,.6)}
.swc .hd{display:flex;align-items:center;gap:12.5px;padding:16px 17.5px}
.swc .av{display:flex;align-items:center;justify-content:center;flex:none;width:37.5px;height:37.5px;border-radius:50%;color:#16130f;font-size:16px;font-weight:700}
.swc .nm{font-size:17.5px;font-weight:600;letter-spacing:-.01em;color:#f2f4f7;white-space:nowrap}
.swc .ch{margin-left:auto;flex:none;padding:5px 12.5px;border-radius:999px;border:1.5px solid rgba(255,255,255,.12);font-size:14.4px;color:#b3b9c4}
.swc .md{position:relative;height:475.5px;background:#15171b;overflow:hidden}
.swc .md img{display:block;width:100%;height:100%;object-fit:cover}
.swc .cp{padding:15px 20px 5px;font-size:16.9px;line-height:1.5;color:#b3b9c4;height:96px}
.swc .ft{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 19px}
.swc .slot{display:inline-flex;align-items:center;gap:9px;font-size:13.75px;font-weight:500;letter-spacing:.08em;color:#878d98}
.swc .slot i{display:block;width:7.5px;height:7.5px;flex:none}
.swc .wt{font-size:13.1px;font-weight:500;letter-spacing:.1em;color:#878d98}
.swc .stamp{position:absolute;top:82px;left:20px;padding:9px 17.5px;border-radius:15px;border:2.5px solid rgba(242,244,247,.9);font-size:17.5px;font-weight:600;letter-spacing:.14em;color:#f2f4f7;background:rgba(5,6,8,.55);transform-origin:0 50%}

/* End card */
.name{position:absolute;font-weight:600;letter-spacing:-.045em;line-height:1;white-space:nowrap;color:#f2f4f7}
.endl{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap}

/* Through-line object */
#tlo{position:absolute;left:0;top:0;overflow:hidden}
#tlo > *{position:absolute}
#tlo-caret{background:#7cc6ff}
#tlo-star{overflow:visible}
#tlo-txt{left:0;top:0;width:100%;height:100%}
#tlo-txt span{position:absolute;left:0;top:0;width:100%;text-align:center;font-weight:500;letter-spacing:.08em;color:#7cc6ff;white-space:nowrap}
#tlo-mark{left:0;top:0;width:100%;height:100%}

/* Cursor (screen space) */
#cursor{position:absolute;left:0;top:0;width:34px;height:50px;transform-origin:0 0}
#hud{position:absolute;right:20px;top:16px;font:500 22px 'Geist';color:#5d626c;letter-spacing:.04em}
</style>
</head>

/* ------------------------------------------------------------ math --- */
var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
// Damped spring step response: 0 before t=0, settles at 1. r = response (s),
// z = damping ratio. z 0.8+ keeps the overshoot near 1%.
function spring(t, r, z) {
  if (t <= 0) return 0;
  r = r || 0.45; z = z || 0.82;
  var w = TAU / r;
  if (z >= 1) { var e = Math.exp(-w * t); return 1 - e * (1 + w * t); }
  var wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
// Spring from x0 with initial velocity v0 towards x1.
function springIV(t, x0, v0, x1, r, z) {
  if (t <= 0) return x0 + v0 * t;
  var w = TAU / r, A = x0 - x1;
  if (z >= 1) { var B = v0 + w * A; return x1 + (A + B * t) * Math.exp(-w * t); }
  var wd = w * Math.sqrt(1 - z * z);
  var B2 = (v0 + z * w * A) / wd;
  return x1 + Math.exp(-z * w * t) * (A * Math.cos(wd * t) + B2 * Math.sin(wd * t));
}
// Exponential ease-out over d seconds.
function expo(t, d, k) {
  if (t <= 0) return 0; if (t >= d) return 1;
  k = k || 6.5;
  return (1 - Math.exp(-k * t / d)) / (1 - Math.exp(-k));
}
// Exponential ease-in (for exits that leave the frame).
function expoIn(t, d) { if (t <= 0) return 0; if (t >= d) return 1; var k = 5; return (Math.exp(k * t / d) - 1) / (Math.exp(k) - 1); }

// a spring, and the springs superpose (exactly what a linear spring does).
function track(keys) {
  return function (t) {
    var v = keys[0][1];
    for (var i = 1; i < keys.length; i++) {
      var k = keys[i];

}
